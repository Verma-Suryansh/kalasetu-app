<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALA-SETU | Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inject html2pdf.js via CDN for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { navy: { 900: '#0F2027', 700: '#1A365D' }, terracotta: { 500: '#D9531E', 600: '#C85A32' }, cream: '#FDFBF7' }, fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
    }
  </script>
  <style>
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 0; background: transparent; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex justify-center items-center font-sans antialiased">
  <div class="w-full max-w-md bg-cream h-[100dvh] shadow-2xl relative flex flex-col overflow-y-auto">
    <header class="bg-navy-900 text-white p-4 sticky top-0 z-20 shadow-md">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-extrabold tracking-wide">KALA-SETU</h1>
          <p class="text-[10px] text-gray-300 uppercase font-semibold">Bridging Artisans to Markets</p>
        </div>
        <span class="bg-white/10 text-[9px] px-2 py-0.5 rounded text-terracotta-500 font-bold border border-white/10">PROTOTYPE</span>
      </div>
    </header>

    <main class="flex-1 p-4 pb-8">
      <!-- SCREEN 1: DASHBOARD -->
      <div id="screen-1" class="screen active">
        <button onclick="navigateTo('screen-2')" class="w-full bg-terracotta-600 text-white font-bold py-4 rounded-xl shadow-md mb-6">+ Catalog New Craft</button>
        <h3 class="text-xs font-bold text-gray-500 uppercase mb-3">Live Network Feed</h3>
        <div id="dashboard-list" class="space-y-3">
          <!-- Dynamic Items Injected Here -->
        </div>
      </div>

      <!-- SCREEN 2: INGESTION -->
      <div id="screen-2" class="screen">
        <button onclick="navigateTo('screen-1')" class="text-xs font-bold text-navy-700 mb-4">← Back</button>
        <div class="space-y-4">
          <select id="artisan-select" class="w-full border rounded-xl p-3 text-sm outline-none">
            <option value="Meera Bai">Meera Bai (Bamboo Craft)</option>
            <option value="Sunita Devi">Sunita Devi (Textiles)</option>
          </select>
          <div class="relative w-full h-36 border-2 border-dashed border-gray-300 rounded-xl bg-white flex flex-col items-center justify-center overflow-hidden">
            <input type="file" accept="image/*" onchange="handleImage(event)" class="absolute inset-0 opacity-0 cursor-pointer z-10">
            <img id="preview-raw" class="hidden absolute inset-0 w-full h-full object-cover">
            <p id="preview-placeholder" class="text-xs font-semibold text-gray-600">Tap to photograph handicraft</p>
          </div>
          <div class="bg-white p-3.5 rounded-xl border">
            <button id="mic-btn" onclick="toggleVoice()" class="w-full mb-2 bg-red-50 text-red-600 font-bold py-2 rounded-lg text-xs">🎙 Record Voice (Hindi)</button>
            <textarea id="transcript" class="w-full text-xs border rounded-lg p-2.5 bg-gray-50 outline-none" rows="3">Yeh bamboo ki tokri hai. 3 ghante lage aur raw material 150 rupaye ka laga.</textarea>
          </div>
          <button onclick="executeRealAI()" class="w-full bg-navy-900 text-white font-extrabold py-3.5 rounded-xl">RUN REAL AI PIPELINE →</button>
        </div>
      </div>

      <!-- SCREEN 3: SPINNER -->
      <div id="screen-3" class="screen text-center py-20">
        <div class="w-14 h-14 border-4 border-gray-200 border-t-terracotta-600 rounded-full animate-spin mx-auto mb-4"></div>
        <h3 class="font-extrabold text-navy-900 text-sm">Executing Multimodal AI Pipeline...</h3>
      </div>

      <!-- SCREEN 4: GENERATED LISTING REVIEW -->
      <div id="screen-4" class="screen">
        <div id="pdf-content" class="bg-white rounded-xl border border-gray-200 overflow-hidden mb-4 pb-2">
          <div class="h-44 bg-gray-100 flex items-center justify-center"><img id="review-img" class="w-full h-full object-contain p-2"></div>
          <div class="p-3">
            <h3 id="res-title" class="font-bold text-sm text-gray-900">Loading...</h3>
            <p id="res-meta" class="text-[10px] text-terracotta-600 font-semibold mb-2"></p>
            
            <!-- Multi-lingual SEO -->
            <div class="bg-gray-50 p-2 rounded-md mb-3 border border-gray-100">
              <p class="text-[9px] font-bold text-gray-500 uppercase mb-1">Generated SEO Descriptions:</p>
              <p id="res-desc-en" class="text-[10px] text-gray-800 mb-1 leading-tight"><span class="font-bold">EN:</span> </p>
              <p id="res-desc-hi" class="text-[10px] text-gray-800 mb-1 leading-tight"><span class="font-bold">HI:</span> </p>
              <p id="res-desc-ta" class="text-[10px] text-gray-800 leading-tight"><span class="font-bold">TA:</span> </p>
            </div>

            <div class="text-xs space-y-1 text-gray-600">
              <div class="flex justify-between"><span>Material Cost:</span><span id="res-mat"></span></div>
              <div class="flex justify-between"><span>Labor Value:</span><span id="res-labour"></span></div>
              <div class="flex justify-between font-extrabold text-navy-900 pt-1 border-t text-sm">
                <span>ONDC Price:</span><span id="res-price" class="text-terracotta-600"></span>
              </div>
            </div>
          </div>
        </div>
        <button onclick="approveListing()" class="w-full bg-terracotta-600 text-white py-3 rounded-xl font-extrabold text-xs shadow-md">APPROVE & SAVE TO CATALOG</button>
      </div>

      <!-- SCREEN 5: SUCCESS & PDF DOWNLOAD -->
      <div id="screen-5" class="screen pt-4 text-center">
        <div class="w-12 h-12 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto mb-2 shadow-lg">✓</div>
        <h2 class="text-base font-extrabold text-green-800 uppercase">Catalog Formatted</h2>
        <p class="text-[10px] text-green-700 font-bold mb-4">ONDC-READY</p>
        <button onclick="downloadPDF()" class="w-full mb-3 bg-white border-2 border-navy-900 text-navy-900 py-3.5 rounded-xl font-bold text-xs">📄 Download ONDC PDF Label</button>
        <button onclick="navigateTo('screen-1')" class="w-full bg-navy-900 text-white py-3.5 rounded-xl font-bold text-xs">Return to Dashboard</button>
      </div>
    </main>
  </div>

  <script>
    let rawImageData = null;
    let currentItem = {};

    function navigateTo(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if(id === 'screen-1') loadDashboard();
    }

    function handleImage(e) {
      const reader = new FileReader();
      reader.onload = () => {
        rawImageData = reader.result;
        document.getElementById('preview-raw').src = rawImageData;
        document.getElementById('preview-raw').classList.remove('hidden');
        document.getElementById('preview-placeholder').classList.add('hidden');
      };
      if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    }

    let recognition;
    let isRec = false;
    if ('webkitSpeechRecognition' in window) {
      recognition = new webkitSpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.onresult = (ev) => document.getElementById('transcript').value = ev.results[0][0].transcript;
      recognition.onend = () => { isRec = false; document.getElementById('mic-btn').innerText = "🎙 Record Voice (Hindi)"; };
    }
    function toggleVoice() {
      if (!recognition) return alert("Use Chrome!");
      if (isRec) recognition.stop();
      else { recognition.start(); isRec = true; document.getElementById('mic-btn').innerText = "Listening..."; }
    }

    async function executeRealAI() {
      navigateTo('screen-3');
      const transcript = document.getElementById('transcript').value;
      const artisan = document.getElementById('artisan-select').value;
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transcript: transcript, artisan: artisan, rawImageBase64: rawImageData })
        });
        const data = await res.json();
        const ai = data.aiData;
        
        currentItem = { title: ai.title, artisan: artisan, price: ai.suggestedPrice };

        document.getElementById('res-title').innerText = ai.title;
        document.getElementById('res-meta').innerText = `${ai.category} • ${artisan}`;
        document.getElementById('res-desc-en').innerHTML = `<span class="font-bold">EN:</span> ${ai.description_en}`;
        document.getElementById('res-desc-hi').innerHTML = `<span class="font-bold">HI:</span> ${ai.description_hi}`;
        document.getElementById('res-desc-ta').innerHTML = `<span class="font-bold">TA:</span> ${ai.description_ta}`;
        document.getElementById('res-mat').innerText = `₹${ai.materialCost}`;
        document.getElementById('res-labour').innerText = `₹${ai.fairLabourValue} (${ai.laborHours} hrs)`;
        document.getElementById('res-price').innerText = `₹${ai.suggestedPrice}`;
        document.getElementById('review-img').src = data.studioImage || rawImageData || 'https://via.placeholder.com/300';
        navigateTo('screen-4');
      } catch (err) { alert("Error: " + err.message); navigateTo('screen-2'); }
    }

    function approveListing() {
      let catalog = JSON.parse(localStorage.getItem('kalasetu_catalog') || '[]');
      catalog.unshift(currentItem);
      localStorage.setItem('kalasetu_catalog', JSON.stringify(catalog));
      navigateTo('screen-5');
    }

    function loadDashboard() {
      let catalog = JSON.parse(localStorage.getItem('kalasetu_catalog') || '[]');
      let html = '';
      if (catalog.length === 0) html = `<p class="text-xs text-gray-500">No crafts cataloged yet.</p>`;
      catalog.forEach(item => {
        html += `<div class="bg-white p-3 rounded-xl border flex justify-between items-center mb-2"><div><p class="font-bold text-sm text-gray-800">${item.title}</p><p class="text-[10px] text-gray-500">${item.artisan} • ₹${item.price}</p></div><span class="bg-green-50 text-green-700 text-[10px] px-2 py-0.5 rounded font-bold border border-green-200">ONDC-READY</span></div>`;
      });
      document.getElementById('dashboard-list').innerHTML = html;
    }

    function downloadPDF() {
      const element = document.getElementById('pdf-content');
      html2pdf().from(element).save('ONDC_Catalog_Label.pdf');
    }

    window.onload = loadDashboard;
  </script>
</body>
</html>
